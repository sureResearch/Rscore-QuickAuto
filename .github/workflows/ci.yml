name: formula-tests

on:
  push:
  pull_request:

jobs:
  test-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile
        run: python -m py_compile rscore_quickauto.py
      - name: Run locked-formula tests
        run: python -m unittest discover -s tests -v
